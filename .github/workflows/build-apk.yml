name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_STRING=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          echo "Detected Java version string: $JAVA_VERSION_STRING"

          if [ -z "$JAVA_VERSION_STRING" ]; then
            echo "Error: Unable to detect Java version from 'java -version'."
            exit 1
          fi

          JAVA_MAJOR=$(echo "$JAVA_VERSION_STRING" | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected active Java major version: $JAVA_MAJOR"

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to parse Java major version: '$JAVA_MAJOR'."
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_MAJOR) is lower than required Java 17."
            exit 1
          fi

          echo "Java environment verified successfully: Java $JAVA_MAJOR is active (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Temporary Debug Keystore Check ==="
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "./debug.keystore is missing. Generating temporary debug keystore using keytool..."
            "$JAVA_HOME/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to create ./debug.keystore."
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

          if [ ! -s "./debug.keystore" ]; then
            echo "Error: ./debug.keystore is empty or invalid."
            exit 1
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying Debug APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Expected APK at $EXPECTED_APK not found!"
            echo "Searching inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            echo "Error: Expected debug APK $EXPECTED_APK does not exist."
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: $EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Discovered APK is not exactly app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          echo "Verified APK successfully:"
          ls -l "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          TEMP_ASSET_DIR="${RUNNER_TEMP:-/tmp}/apk-release-asset"
          mkdir -p "$TEMP_ASSET_DIR"

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr -cs 'a-zA-Z0-9._-' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          RELEASE_FILENAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TARGET_ASSET_PATH="${TEMP_ASSET_DIR}/${RELEASE_FILENAME}"

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ]; then
            echo "Error: Source APK $SOURCE_APK not found."
            exit 1
          fi

          cp "$SOURCE_APK" "$TARGET_ASSET_PATH"

          if [ ! -f "$TARGET_ASSET_PATH" ] || [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $TARGET_ASSET_PATH."
            exit 1
          fi

          echo "Prepared release asset: $TARGET_ASSET_PATH ($RELEASE_FILENAME)"
          echo "asset_path=$TARGET_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="

          gh --version
          if ! command -v gh >/dev/null 2>&1; then
            echo "Error: GitHub CLI (gh) is not available in runner."
            exit 1
          fi

          if [ -z "$RELEASE_ASSET_PATH" ] || [ ! -f "$RELEASE_ASSET_PATH" ]; then
            echo "Error: Prepared release asset ($RELEASE_ASSET_PATH) does not exist."
            exit 1
          fi

          if [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "Error: Release asset ($RELEASE_ASSET_PATH) is empty."
            exit 1
          fi

          case "$RELEASE_ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Release asset ($RELEASE_ASSET_PATH) does not have .apk extension."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(printf "%s\n" \
            "### Automated Debug APK Build" \
            "" \
            "- **Build Type**: Automatically generated debug APK" \
            "- **Built By**: GitHub Actions" \
            "- **Run Number**: ${GITHUB_RUN_NUMBER}" \
            "- **Run Attempt**: ${GITHUB_RUN_ATTEMPT}" \
            "- **Source Commit SHA**: ${GITHUB_SHA}" \
            "- **Purpose**: Intended for testing only" \
            "- **Production Notice**: This is not a Play Store production release" \
            "- **Signing Status**: Signed only with a temporary debug keystore" \
            "" \
            "> This is an automatically generated debug APK built by GitHub Actions. The APK is intended for testing and is not a Play Store production release. It is signed only with a temporary debug keystore.")

          echo "Creating release $RELEASE_TAG for commit $GITHUB_SHA..."
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "Release created successfully."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          echo "=== APK Download & Release Report ==="
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing SUCCEEDED."

            gh release view "$RELEASE_TAG" --json url,tagName,title 2>/dev/null || true
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $RELEASE_ASSET_NAME"

            {
              echo "### 🚀 Debug APK Build & Release Succeeded"
              echo ""
              echo "- **Release Title**: $RELEASE_TITLE"
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Direct Download Page**: [View GitHub Release]($RELEASE_URL)"
              echo "- **APK Asset Filename**: \`$RELEASE_ASSET_NAME\`"
              echo ""
              echo "📱 **Download Instructions**:"
              echo "You can download the APK directly on your phone from the **Assets** section of the [Release Page]($RELEASE_URL)."
              echo ""
              echo "💾 **Backup Artifact**: The standard Actions artifact \`app-debug-apk\` is also available in the workflow summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "APK Build Status: SUCCEEDED"
            echo "Artifact Status: Actions artifact 'app-debug-apk' remains available."

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Incomplete)"
              echo ""
              echo "- **APK Build**: Succeeded (app-debug.apk created successfully)."
              echo "- **GitHub Actions Artifact**: The backup artifact \`app-debug-apk\` remains available in this workflow run's summary."
              echo "- **GitHub Release**: Publishing encountered an issue or was skipped. Please download the APK from the Actions artifact named \`app-debug-apk\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
